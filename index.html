<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Practice Exercises</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .exercise {
            margin-bottom: 20px;
            padding: 15px;
            border-left: 4px solid #3498db;
            background: #ecf0f1;
            border-radius: 4px;
        }
        input[type="text"] {
            padding: 8px;
            width: 60%;
            margin-top: 8px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
        }
        button {
            padding: 8px 15px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover {
            background-color: #27ae60;
        }
        .feedback {
            margin-top: 5px;
            font-weight: bold;
        }
        .correct { color: #27ae60; }
        .incorrect { color: #c0392b; }
        .reveal { color: #e67e22; }
    </style>
</head>
<body>
    <div class="container">
        <h1>English Practice Exercises</h1>
        <p>Unscramble the words, answer the questions, and practice today's grammar.</p>

        <div id="exercises-container"></div>
    </div>

    <script>
        const exercises = [
            { id: 1, prompt: "Unscramble to form the occupation question:", words: ["does", "What", "she", "do?"], answer: "What does she do?" },
            { id: 2, prompt: "Unscramble to say 'She is a doctor':", words: ["is", "She", "a", "doctor"], answer: "She is a doctor" },
            { id: 3, prompt: "Unscramble to form the plural question:", words: ["do", "What", "they", "do?"], answer: "What do they do?" },
            { id: 4, prompt: "Unscramble to say 'They are engineers':", words: ["are", "They", "engineers"], answer: "They are engineers" },
            { id: 5, prompt: "Unscramble the sentence with the correct article (vowel sound):", words: ["is", "She", "artist", "an"], answer: "She is an artist" },
            { id: 6, prompt: "Unscramble the sentence with 'student':", words: ["student", "is", "She", "a"], answer: "She is a student" },
            { id: 7, prompt: "Unscramble the sentence with 'chef':", words: ["chef", "a", "is", "She"], answer: "She is a chef" },
            { id: 8, prompt: "Unscramble the response about your own occupation:", words: ["teacher", "am", "English", "an", "I"], answer: "I am an English teacher" },
            { id: 9, prompt: "Unscramble the question about age:", words: ["old", "are", "How", "you?"], answer: "How old are you?" },
            { id: 10, prompt: "Unscramble to state your age (example):", words: ["years", "I", "old", "am", "32"], answer: "I am 32 years old" }
        ];

        const attempts = {};
        const container = document.getElementById("exercises-container");

        exercises.forEach((ex, index) => {
            attempts[ex.id] = 0;
            const shuffledWords = [...ex.words].sort(() => Math.random() - 0.5);

            const div = document.createElement("div");
            div.className = "exercise";
            div.innerHTML = `
                <p><strong>Exercise ${index + 1}:</strong> ${ex.prompt}</p>
                <p><em>Scrambled words:</em> [ ${shuffledWords.join(", ")} ]</p>
                <input type="text" id="input-${ex.id}" placeholder="Type your answer here...">
                <button onclick="checkAnswer(${ex.id}, '${ex.answer.replace(/'/g, "\\\\'")}')">Check</button>
                <div id="feedback-${ex.id}" class="feedback"></div>
            `;
            container.appendChild(div);
        });

        function checkAnswer(id, correctAnswer) {
            const userInput = document.getElementById(`input-${id}`).value.trim();
            const feedback = document.getElementById(`feedback-${id}`);
            
            if (userInput.toLowerCase() === correctAnswer.toLowerCase()) {
                feedback.textContent = "Correct! Great job!";
                feedback.className = "feedback correct";
                attempts[id] = -1; 
            } else {
                attempts[id]++;
                if (attempts[id] === 1) {
                    feedback.textContent = "Incorrect. Check well and try again!";
                    feedback.className = "feedback incorrect";
                } else {
                    feedback.textContent = `Incorrect. The correct answer was: "${correctAnswer}"`;
                    feedback.className = "feedback reveal";
                }
            }
        }
    </script>
</body>
</html>
